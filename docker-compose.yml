# Whole system on one machine: `docker compose up -d` (configuration in .env, see .env.example).
name: revize

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: revize
      POSTGRES_USER: revize
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastavte POSTGRES_PASSWORD v souboru .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U revize -d revize']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: '${DB_CPU_LIMIT:-1.0}'
          memory: '${DB_MEMORY_LIMIT:-512M}'
    logging:
      driver: 'json-file'
      options:
        max-size: '${LOG_MAX_SIZE:-10m}'
        max-file: '${LOG_MAX_FILE:-3}'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://revize@db:5432/revize
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Nastavte POSTGRES_PASSWORD v souboru .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ORG_NAME: ${ORG_NAME:-Revizní firma}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@revize.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      STORAGE_MAX_GB: ${STORAGE_MAX_GB:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - files:/data/files
    deploy:
      resources:
        limits:
          cpus: '${API_CPU_LIMIT:-2.0}'
          memory: '${API_MEMORY_LIMIT:-1G}'
    logging:
      driver: 'json-file'
      options:
        max-size: '${LOG_MAX_SIZE:-10m}'
        max-file: '${LOG_MAX_FILE:-3}'

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      resources:
        limits:
          cpus: '${WEB_CPU_LIMIT:-1.0}'
          memory: '${WEB_MEMORY_LIMIT:-256M}'
    logging:
      driver: 'json-file'
      options:
        max-size: '${LOG_MAX_SIZE:-10m}'
        max-file: '${LOG_MAX_FILE:-3}'

volumes:
  db-data:
  files:
  caddy-data:
  caddy-config:
